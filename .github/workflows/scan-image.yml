name: scan-image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable GHCR image reference
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image
        run: >-
          docker run --rm aquasec/trivy:0.58.1 image
          --severity CRITICAL,HIGH --ignore-unfixed
          "${{ inputs.image }}"

name: scan-image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable GHCR image reference
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image
        env:
          IMAGE: ${{ inputs.image }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/9c6j/codex-lb@sha256:[a-f0-9]{64}$ ]] || exit 1
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.58.1 image \
            --scanners vuln --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            "$IMAGE"
